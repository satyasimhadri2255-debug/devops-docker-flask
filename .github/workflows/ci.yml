name: CI - Docker Build and Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docker-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-first-devops-app .

      - name: Run container (try 5000)
        run: docker run -d -p 5000:5000 --name flask-test my-first-devops-app

      - name: Show container logs (debug)
        run: docker logs flask-test

      - name: Smoke test (retry curl on 5000)
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            if curl --fail http://localhost:5000/; then
              echo "✅ App responded on 5000"
              exit 0
            fi
            sleep 2
          done

          echo "❌ App did not respond on port 5000"
          echo "Container logs:"
          docker logs flask-test
          exit 1

      - name: Curl health endpoint
        run: curl --fail http://localhost:5000/health


      - name: Install pytest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run pytest
        run: pytest -q


      - name: Stop container
        if: always()
        run: |
          docker stop flask-test || true
          docker rm flask-test || true

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag image
        run: docker tag my-first-devops-app ${{ secrets.DOCKERHUB_USERNAME }}/my-first-devops-app:latest

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-first-devops-app:latest

