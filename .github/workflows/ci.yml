name: CI - Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-first-devops-app .

      - name: Run container
        run: docker run -d -p 5000:5000 --name flask-test my-first-devops-app

      - name: Wait for app
        run: sleep 5

      - name: Curl endpoint
        run: curl --fail http://localhost:5000/

      - name: Stop container
        if: always()
        run: |
          docker stop flask-test
          docker rm flask-test

		
